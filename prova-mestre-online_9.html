<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prova-Mestre</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --bg:#0B1A2B; --bg-grid:#122A44; --surface:#102338; --surface-raised:#14314F;
  --line:#25476C; --line-faint:#1B3450; --ink:#E9F0F7; --ink-muted:#8FA8C4; --ink-faint:#5D7797;
  --teal:#4FD1C5; --teal-dim:#2C6E68; --amber:#E8A33D; --amber-dim:#6B4E22; --green:#7FD88F; --red:#E17B7B;
  --f-display:'Space Grotesk','IBM Plex Sans',sans-serif; --f-body:'IBM Plex Sans',sans-serif; --f-mono:'IBM Plex Mono',monospace;
}
* { box-sizing:border-box; }
body {
  margin:0; background-color:var(--bg);
  background-image:linear-gradient(var(--bg-grid) 1px,transparent 1px),linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px);
  background-size:28px 28px; color:var(--ink); font-family:var(--f-body);
}
.wrap { max-width:1080px; margin:0 auto; padding:0 20px 60px; }
.wrap-narrow { max-width:560px; margin:0 auto; padding:0 20px 60px; }
.header { display:flex; justify-content:space-between; align-items:center; padding:18px 0; border-bottom:1px solid var(--line); margin-bottom:22px; flex-wrap:wrap; gap:10px; }
.brand { display:flex; align-items:center; gap:10px; }
.brand-mark { width:30px; height:30px; border:1.5px solid var(--teal); display:flex; align-items:center; justify-content:center; transform:rotate(45deg); }
.brand-mark span { transform:rotate(-45deg); color:var(--teal); font-family:var(--f-display); font-weight:700; font-size:13px; }
.brand-title { font-family:var(--f-display); font-weight:600; font-size:15px; }
.brand-sub { font-family:var(--f-mono); font-size:9px; color:var(--ink-faint); letter-spacing:.08em; }
.mode-toggle { display:flex; border:1px solid var(--line); }
.mode-toggle div { padding:7px 14px; cursor:pointer; font-family:var(--f-mono); font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-muted); }
.mode-toggle div.active { background:var(--teal); color:#062723; }
.eyebrow { font-family:var(--f-mono); font-size:11px; color:var(--teal); letter-spacing:.1em; margin-bottom:6px; }
h1 { font-family:var(--f-display); font-size:24px; font-weight:600; margin:0 0 18px; }
h1.tight { margin-bottom:0; }
.layout { display:grid; grid-template-columns:190px 1fr; gap:26px; }
@media (max-width:760px) { .layout { grid-template-columns:1fr; } .two-col { grid-template-columns:1fr !important; } }
.nav { display:flex; flex-direction:column; gap:4px; }
.nav-item { display:flex; align-items:center; gap:9px; padding:9px 12px; cursor:pointer; font-size:13px; font-weight:500; color:var(--ink-faint); border-left:2px solid transparent; }
.nav-item.active { color:var(--ink); background:var(--surface-raised); border-left-color:var(--teal); }
.card { position:relative; background:var(--surface); border:1px solid var(--line); padding:18px; }
.corner { position:absolute; width:9px; height:9px; border-color:var(--line-faint); }
.corner.tl { top:-1px; left:-1px; border-top:2px solid; border-left:2px solid; }
.corner.tr { top:-1px; right:-1px; border-top:2px solid; border-right:2px solid; }
.corner.bl { bottom:-1px; left:-1px; border-bottom:2px solid; border-left:2px solid; }
.corner.br { bottom:-1px; right:-1px; border-bottom:2px solid; border-right:2px solid; }
.card.accent-teal .corner { border-color:var(--teal); }
.card.accent-amber .corner { border-color:var(--amber); }
.corners { }
.grid-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
.stat-label { font-family:var(--f-mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); }
.stat-value { font-family:var(--f-display); font-size:24px; font-weight:600; margin-top:6px; }
.stat-value small { font-size:12px; color:var(--ink-faint); margin-left:4px; }
.pill { display:inline-flex; align-items:center; gap:4px; font-family:var(--f-mono); font-size:10px; letter-spacing:.04em; padding:3px 8px; border-radius:3px; text-transform:uppercase; background:var(--surface-raised); color:var(--ink-muted); border:1px solid var(--line); }
.pill.teal { background:rgba(79,209,197,.1); color:var(--teal); border-color:var(--teal-dim); }
.pill.amber { background:rgba(232,163,61,.1); color:var(--amber); border-color:var(--amber-dim); }
.pill.green { background:rgba(127,216,143,.1); color:var(--green); border-color:#3E6B45; }
.btn { display:inline-flex; align-items:center; gap:6px; font-family:var(--f-display); font-weight:600; font-size:13px; padding:9px 15px; cursor:pointer; border:1px solid var(--teal); background:var(--teal); color:#062723; }
.btn:disabled { opacity:.4; cursor:not-allowed; }
.btn.ghost { background:transparent; color:var(--ink); border-color:var(--line); }
.btn.subtle { background:var(--surface-raised); color:var(--ink-muted); border-color:var(--line); font-size:12px; padding:6px 10px; }
.btn.danger { background:transparent; color:var(--red); border-color:#6B3E3E; }
.seal { display:inline-flex; align-items:center; gap:8px; border:1.5px dashed var(--amber); border-radius:999px; padding:6px 14px; color:var(--amber); font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; transform:rotate(-2deg); }
.dots { display:flex; gap:3px; }
.dot { width:6px; height:6px; border-radius:1px; background:var(--line-faint); }
.dot.on { background:var(--amber); }
.row { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
.muted { color:var(--ink-faint); }
.mono { font-family:var(--f-mono); }
.list-item { display:flex; align-items:center; gap:12px; padding:11px 13px; cursor:pointer; background:var(--surface); border:1px solid var(--line); margin-bottom:8px; }
.list-item.checked { background:rgba(79,209,197,.07); border-color:var(--teal-dim); }
.checkbox { width:17px; height:17px; border:1.5px solid var(--ink-faint); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; }
.checkbox.on { border-color:var(--teal); background:var(--teal); color:#062723; }
.field { margin-bottom:13px; }
.field label { font-size:12px; color:var(--ink-muted); display:block; margin-bottom:5px; }
.field input, .field select, .field textarea { width:100%; background:var(--surface-raised); border:1px solid var(--line); color:var(--ink); padding:8px 10px; font-family:var(--f-body); font-size:13px; }
.field textarea { resize:vertical; min-height:70px; font-family:var(--f-mono); font-size:12.5px; }
.field input.mono { font-family:var(--f-mono); }
.field .hint { font-size:11px; color:var(--ink-faint); margin-top:4px; }
.divider { border-top:1px solid var(--line-faint); margin:14px 0; padding-top:14px; }
.option { display:flex; align-items:center; gap:12px; padding:11px 14px; cursor:pointer; background:var(--surface-raised); border:1px solid var(--line); margin-bottom:8px; }
.option.selected { background:rgba(79,209,197,.08); border-color:var(--teal); }
.option-letter { width:22px; height:22px; border-radius:50%; flex-shrink:0; border:1.5px solid var(--ink-faint); color:var(--ink-faint); display:flex; align-items:center; justify-content:center; font-family:var(--f-mono); font-size:11px; font-weight:600; }
.option.selected .option-letter { border-color:var(--teal); background:var(--teal); color:#062723; }
.progress-track { display:flex; gap:4px; margin:10px 0; }
.progress-seg { flex:1; height:4px; background:var(--line-faint); cursor:pointer; }
.progress-seg.answered { background:var(--teal); }
.progress-seg.current { background:var(--ink-faint); }
.spinner { color:var(--ink-faint); font-family:var(--f-mono); font-size:13px; text-align:center; padding:40px; }
.error-box { color:var(--red); font-family:var(--f-mono); font-size:12.5px; padding:14px; border:1px solid #6B3E3E; background:rgba(225,123,123,.06); margin-bottom:14px; }
.ok-box { color:var(--green); font-family:var(--f-mono); font-size:12.5px; padding:14px; border:1px solid #3E6B45; background:rgba(127,216,143,.06); margin-bottom:14px; }
.var-row { display:grid; grid-template-columns:1fr 70px 70px 60px 30px; gap:6px; margin-bottom:6px; align-items:center; }
.var-row input { padding:6px 8px; font-size:12px; }
a { color:inherit; }
code { font-family:var(--f-mono); color:var(--teal); background:rgba(79,209,197,.08); padding:1px 5px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   ARMAZENAMENTO (persistente entre sessões, compartilhado entre
   todos que abrem este mesmo app — professor e alunos)
   ============================================================ */
async function storageGet(key) {
  try {
    const r = await window.storage.get(key, true);
    return r ? JSON.parse(r.value) : null;
  } catch (e) { return null; }
}
async function storageSet(key, value) {
  try {
    await window.storage.set(key, JSON.stringify(value), true);
    return true;
  } catch (e) { console.error("Erro ao salvar:", e); return false; }
}
function armazenamentoDisponivel() {
  return typeof window.storage !== "undefined" && window.storage !== null;
}
function bannerSemArmazenamento() {
  if (armazenamentoDisponivel()) return "";
  return `
    <div class="error-box" style="margin-bottom:16px;">
      <b>⚠ Este arquivo está aberto localmente (fora do Claude) e por isso NADA que você fizer aqui vai ser salvo.</b>
      <div style="margin-top:6px;">Para o salvamento funcionar, use o painel do artefato dentro da conversa do Claude, ou o link publicado pelo Claude —
      não o arquivo .html baixado no seu computador (endereços que começam com <code>file:///</code>).</div>
    </div>
  `;
}

/* ============================================================
   MOTOR DE RANDOMIZAÇÃO E PARAMETRIZAÇÃO
   ============================================================ */
class Rng {
  constructor(seed) { this.state = seed % 2147483647; if (this.state <= 0) this.state += 2147483646; }
  next() { this.state = (this.state * 16807) % 2147483647; return this.state / 2147483647; }
  int(min, max) { return Math.floor(this.next() * (max - min + 1)) + min; }
  float(min, max) { return this.next() * (max - min) + min; }
}
function hashSeed(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return h || 1;
}
function roundTo(n, d) { const f = Math.pow(10, d); return Math.round(n * f) / f; }
function gerarCodigo() { return Math.random().toString(36).slice(2, 8).toUpperCase(); }
function shuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) { const j = rng.int(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}

// avaliador de expressões aritméticas simples (+ - * / parênteses), sem eval()
function avaliarExpressao(expr, vars) {
  const s = expr.replace(/\s+/g, "");
  let i = 0;
  function peek() { return s[i]; }
  function parseNumber() { let start = i; while (i < s.length && /[0-9.]/.test(s[i])) i++; return parseFloat(s.slice(start, i)); }
  function parseIdent() {
    let start = i;
    while (i < s.length && /[A-Za-zΑ-Ωα-ω0-9_]/.test(s[i])) i++;
    const name = s.slice(start, i);
    if (!(name in vars)) throw new Error(`Variável desconhecida: "${name}"`);
    return vars[name];
  }
  function parsePrimary() {
    if (peek() === "(") { i++; const v = parseExpr(); if (peek() !== ")") throw new Error("Parêntese não fechado"); i++; return v; }
    if (peek() === "-") { i++; return -parsePrimary(); }
    if (/[0-9.]/.test(peek())) return parseNumber();
    if (/[A-Za-zΑ-Ωα-ω_]/.test(peek())) return parseIdent();
    throw new Error("Expressão inválida perto de: " + s.slice(i));
  }
  function parseTerm() {
    let v = parsePrimary();
    while (peek() === "*" || peek() === "/") { const op = s[i]; i++; const r = parsePrimary(); v = op === "*" ? v * r : v / r; }
    return v;
  }
  function parseExpr() {
    let v = parseTerm();
    while (peek() === "+" || peek() === "-") { const op = s[i]; i++; const r = parseTerm(); v = op === "+" ? v + r : v - r; }
    return v;
  }
  if (s.length === 0) throw new Error("Fórmula vazia");
  const result = parseExpr();
  if (i < s.length) throw new Error("Caracteres inesperados: " + s.slice(i));
  if (!isFinite(result)) throw new Error("Resultado inválido (divisão por zero?)");
  return result;
}

function gerarValores(questao, rng) {
  const valores = {};
  questao.variaveis.forEach((v) => {
    valores[v.nome] = v.decimais > 0 ? roundTo(rng.float(v.min, v.max), v.decimais) : rng.int(v.min, v.max);
  });
  return valores;
}
function montarEnunciado(template, valores) {
  let out = template;
  Object.entries(valores).forEach(([k, v]) => { out = out.split(`{${k}}`).join(v); });
  return out;
}
function gerarAlternativas(respostaCorreta, rng) {
  const valores = new Set([respostaCorreta]);
  const fatores = [0.5, 0.75, 1.25, 1.5, 2];
  let tentativas = 0;
  while (valores.size < 5 && tentativas < 80) {
    tentativas++;
    const fator = fatores[rng.int(0, fatores.length - 1)];
    const sinal = rng.int(0, 1) ? 1 : -1;
    const errado = roundTo(respostaCorreta * fator + sinal * rng.int(1, 3), 2);
    if (errado > 0 && errado !== respostaCorreta && !valores.has(errado)) valores.add(errado);
  }
  const arr = Array.from(valores).map((valor) => ({ valor, correta: valor === respostaCorreta }));
  return shuffle(arr, rng).map((a, i) => ({ ...a, letra: String.fromCharCode(65 + i) }));
}

function gerarProvaAluno(provaMestre, questoesBanco, alunoNome, codigo) {
  const seedStr = `${provaMestre.id}:${alunoNome}:${codigo}`;
  const rng = new Rng(hashSeed(seedStr));
  const questoesSelecionadas = provaMestre.questaoIds.map((id) => questoesBanco.find((q) => q.id === id)).filter(Boolean);
  const ordem = shuffle([...questoesSelecionadas], rng);
  return ordem.map((q) => {
    const valores = gerarValores(q, rng);
    let respostaCorreta;
    try { respostaCorreta = roundTo(avaliarExpressao(q.formula, valores), 2); }
    catch (e) { respostaCorreta = 0; }
    const enunciadoFinal = montarEnunciado(q.enunciado, valores);
    const alternativas = gerarAlternativas(respostaCorreta, rng);
    return {
      questaoId: q.id, tema: q.tema, unidade: q.unidade, enunciado: enunciadoFinal,
      alternativas, respostaCorretaLetra: alternativas.find((a) => a.correta).letra,
    };
  });
}

/* ============================================================
   BANCO DE QUESTÕES PADRÃO (usado na primeira vez que o app abre)
   ============================================================ */
const QUESTOES_PADRAO = [
  { id: "q1", tema: "Mecânica — Leis de Newton", dificuldade: 2, unidade: "m/s²",
    enunciado: "Um bloco de massa {m} kg é empurrado por uma força horizontal de {F} N sobre uma superfície sem atrito. Qual é a aceleração do bloco?",
    variaveis: [{ nome: "F", min: 20, max: 100, decimais: 0 }, { nome: "m", min: 4, max: 16, decimais: 0 }], formula: "F/m" },
  { id: "q2", tema: "Cinemática — MRU", dificuldade: 1, unidade: "km/h",
    enunciado: "Um carro percorre {d} km em {t} horas, em movimento retilíneo uniforme. Qual é a sua velocidade média?",
    variaveis: [{ nome: "d", min: 60, max: 180, decimais: 0 }, { nome: "t", min: 1, max: 4, decimais: 0 }], formula: "d/t" },
  { id: "q3", tema: "Termologia — Calor sensível", dificuldade: 3, unidade: "°C",
    enunciado: "Uma massa de {m} g de água recebe {Q} cal de calor. Sabendo que o calor específico da água é 1 cal/g°C, qual a variação de temperatura?",
    variaveis: [{ nome: "m", min: 100, max: 200, decimais: 0 }, { nome: "Q", min: 800, max: 1800, decimais: 0 }], formula: "Q/m" },
  { id: "q4", tema: "Matemática Financeira — Juros simples", dificuldade: 2, unidade: "R$",
    enunciado: "Um capital de R$ {C},00 é aplicado a juros simples de {i}% ao mês, durante {t} meses. Qual o valor total dos juros?",
    variaveis: [{ nome: "C", min: 1000, max: 5000, decimais: 0 }, { nome: "i", min: 2, max: 6, decimais: 0 }, { nome: "t", min: 3, max: 9, decimais: 0 }], formula: "(C*i*t)/100" },
  { id: "q5", tema: "Eletrodinâmica — Lei de Ohm", dificuldade: 2, unidade: "A",
    enunciado: "Um resistor de {R} Ω é submetido a uma tensão de {V} V. Qual é a corrente elétrica que o percorre?",
    variaveis: [{ nome: "R", min: 10, max: 50, decimais: 0 }, { nome: "V", min: 20, max: 60, decimais: 0 }], formula: "V/R" },
  { id: "q6", tema: "Estatística — Média aritmética", dificuldade: 1, unidade: "pts",
    enunciado: "As notas de um aluno em {n} provas foram somadas e totalizaram {soma} pontos. Qual foi a média do aluno?",
    variaveis: [{ nome: "n", min: 3, max: 5, decimais: 0 }, { nome: "soma", min: 200, max: 350, decimais: 0 }], formula: "soma/n" },
];

/* ============================================================
   ESTADO GERAL DO APP
   ============================================================ */
const state = {
  papel: null,          // "professor" | "aluno" | null (tela inicial)
  view: "dashboard",
  questoes: [],
  provas: [],
  selecionadas: new Set(),
  provaAtualId: null,
  novaQuestaoVars: [{ nome: "", min: 0, max: 10, decimais: 0 }, { nome: "", min: 0, max: 10, decimais: 0 }],
  publicarResultado: null,
  aluno: { codigo: "", exam: null, atual: 0, respostas: {}, segundos: null, timer: null, resultado: null },
};

const app = document.getElementById("app");

async function garantirBancoInicial() {
  const existentes = await storageGet("questoes");
  if (!existentes) await storageSet("questoes", QUESTOES_PADRAO);
}

function corners() { return `<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>`; }

/* ============================================================
   TELA INICIAL — escolher papel
   ============================================================ */
function renderInicial() {
  app.innerHTML = `
    <div class="wrap-narrow" style="padding-top:60px; text-align:center;">
      ${bannerSemArmazenamento()}
      <div class="brand" style="justify-content:center; margin-bottom:24px;">
        <div class="brand-mark"><span>PM</span></div>
        <div style="text-align:left;">
          <div class="brand-title">Prova-Mestre</div>
          <div class="brand-sub">SISTEMA DE AVALIAÇÃO EQUIVALENTE</div>
        </div>
      </div>
      <div class="seal" style="margin-bottom:20px;">✓ MESMA PROVA, MESMA DIFICULDADE PRA TODOS</div>
      <p class="muted" style="font-size:13.5px; line-height:1.6; margin-bottom:26px;">
        Você é o professor criando/aplicando a prova, ou um aluno que recebeu um código de acesso?
      </p>
      <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
        <button class="btn" id="btn-professor" style="padding:12px 22px;">Sou professor(a)</button>
        <button class="btn ghost" id="btn-aluno" style="padding:12px 22px;">Sou aluno(a)</button>
      </div>
    </div>
  `;
  document.getElementById("btn-professor").addEventListener("click", () => { state.papel = "professor"; render(); });
  document.getElementById("btn-aluno").addEventListener("click", () => { state.papel = "aluno"; render(); });
}

/* ============================================================
   SHELL DO PROFESSOR
   ============================================================ */
function shellProfessor(conteudoHtml) {
  return `
    <div class="wrap">
      ${bannerSemArmazenamento()}
      <div class="header">
        <div class="brand">
          <div class="brand-mark"><span>PM</span></div>
          <div><div class="brand-title">Prova-Mestre</div><div class="brand-sub">ÁREA DO PROFESSOR</div></div>
        </div>
        <div class="mode-toggle">
          <div id="voltar-inicio">← Trocar de papel</div>
        </div>
      </div>
      <div class="layout">
        <div class="nav">
          <div class="nav-item" data-view="dashboard">Dashboard</div>
          <div class="nav-item" data-view="banco">Banco de Questões</div>
          <div class="nav-item" data-view="montar">Criar Prova</div>
          <div class="nav-item" data-view="resultados">Resultados</div>
        </div>
        <div id="content"></div>
      </div>
    </div>
  `;
}

function ligarShellProfessor() {
  document.getElementById("voltar-inicio").addEventListener("click", () => { state.papel = null; render(); });
  document.querySelectorAll(".nav-item").forEach((el) => {
    el.classList.toggle("active", el.dataset.view === state.view);
    el.addEventListener("click", () => { state.view = el.dataset.view; state.publicarResultado = null; render(); });
  });
}

async function renderProfessor() {
  app.innerHTML = shellProfessor("");
  ligarShellProfessor();
  const content = document.getElementById("content");
  content.innerHTML = `<div class="spinner">Carregando…</div>`;
  try {
    if (state.view === "dashboard") await renderDashboard(content);
    else if (state.view === "banco") await renderBanco(content);
    else if (state.view === "montar") await renderMontar(content);
    else if (state.view === "resultados") await renderResultados(content);
  } catch (e) {
    content.innerHTML = `<div class="error-box">Erro: ${e.message}</div>`;
  }
}

/* ---------------- Dashboard ---------------- */
async function renderDashboard(content) {
  const provas = (await storageGet("provas")) || [];
  state.provas = provas;
  const totalQuestoes = ((await storageGet("questoes")) || []).length;

  content.innerHTML = `
    <div class="eyebrow">PAINEL DO PROFESSOR</div>
    <h1>Provas cadastradas</h1>

/* ---------------- Banco de Questões ---------------- */
async function renderBanco(content, mostrarForm) {
  const questoes = (await storageGet("questoes")) || [];
  state.questoes = questoes;

  content.innerHTML = `
    <div class="row" style="align-items:flex-start;">
      <div><div class="eyebrow">BANCO DE QUESTÕES</div><h1 class="tight">${questoes.length} questões cadastradas</h1></div>
      <button class="btn subtle" id="btn-nova-questao">${mostrarForm ? "Cancelar" : "+ Nova questão"}</button>
    </div>
    <div style="height:16px;"></div>
    ${mostrarForm ? `<div id="form-questao" style="margin-bottom:18px;"></div>` : ""}
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;" class="two-col">
      <div>
        ${questoes.map((q) => `
          <div class="card" style="margin-bottom:10px; cursor:pointer;" data-questao="${q.id}">
            ${corners()}
            <div class="row"><div style="font-weight:600; font-size:13px;">${q.tema}</div>
              <div class="dots">${[1,2,3,4,5].map(i=>`<div class="dot ${i<=q.dificuldade?'on':''}"></div>`).join("")}</div></div>
            <div class="mono muted" style="font-size:11px; margin-top:8px; line-height:1.6;">${q.enunciado.slice(0,90)}…</div>
          </div>
        `).join("")}
      </div>
      <div id="preview-pane">
        <div class="card muted" style="text-align:center; padding:36px; font-size:12.5px;">${corners()}Clique em uma questão para ver a parametrização</div>
      </div>
    </div>
  `;

  document.getElementById("btn-nova-questao").addEventListener("click", () => renderBanco(content, !mostrarForm));
  if (mostrarForm) renderFormNovaQuestao(document.getElementById("form-questao"), questoes, content);

  content.querySelectorAll("[data-questao]").forEach((el) => {
    el.addEventListener("click", () => {
      const q = questoes.find((x) => x.id === el.dataset.questao);
      const rng = new Rng(hashSeed(q.id + ":preview"));
      const valores = gerarValores(q, rng);
      let resposta = null, erro = null, alternativas = [];
      try {
        resposta = roundTo(avaliarExpressao(q.formula, valores), 2);
        alternativas = gerarAlternativas(resposta, rng);
      } catch (e) { erro = e.message; }
      document.getElementById("preview-pane").innerHTML = `
        <div class="card accent-amber">${corners()}
          <span class="pill amber">Preview parametrizado</span>
          <div style="font-weight:600; font-size:14.5px; margin-top:12px;">${q.tema}</div>
          <div style="font-size:13px; margin-top:10px; line-height:1.6;">${montarEnunciado(q.enunciado, valores)}</div>
          ${erro
            ? `<div class="mono" style="color:var(--red); font-size:11.5px; margin-top:10px;">Erro na fórmula: ${erro}</div>`
            : `<div style="display:flex; flex-direction:column; gap:6px; margin-top:12px;">
                ${alternativas.map((a) => `
                  <div style="display:flex; align-items:center; gap:8px; font-size:12.5px; ${a.correta ? 'color:var(--green); font-weight:600;' : 'color:var(--ink-muted);'}">
                    <span class="mono">${a.letra})</span> <span class="mono">${a.valor} ${q.unidade}</span> ${a.correta ? '← correta' : ''}
                  </div>
                `).join("")}
              </div>`}
          <div class="divider mono muted" style="font-size:11px;">Cada aluno recebe outros valores dentro das mesmas faixas — mesmo raciocínio, mesma dificuldade.</div>
          <div style="margin-top:12px;"><button class="btn danger" data-remover="${q.id}">Remover questão</button></div>
        </div>
      `;
      document.querySelector("[data-remover]")?.addEventListener("click", async () => {
        if (!confirm("Remover esta questão do banco?")) return;
        const restantes = questoes.filter((x) => x.id !== q.id);
        await storageSet("questoes", restantes);
        renderBanco(content, false);
      });
    });
  });
}

function renderFormNovaQuestao(container, questoesExistentes, content) {
  container.innerHTML = `
    <div class="card accent-teal">${corners()}
      <div class="mono muted" style="font-size:11px; letter-spacing:.06em; text-transform:uppercase; margin-bottom:14px;">Nova questão parametrizada</div>
      <div id="erro-questao"></div>
      <div class="field"><label>Tema</label><input id="nq-tema" placeholder="Ex: Cinemática — MRU" /></div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div class="field"><label>Dificuldade (1 a 5)</label><input id="nq-dificuldade" type="number" min="1" max="5" value="2" class="mono" /></div>
        <div class="field"><label>Unidade da resposta</label><input id="nq-unidade" placeholder="Ex: km/h" /></div>
      </div>
      <div class="field">
        <label>Enunciado (use {NOME} para cada variável)</label>
        <textarea id="nq-enunciado" placeholder="Ex: Um carro percorre {d} km em {t} horas. Qual a velocidade média?"></textarea>
      </div>
      <div class="field">
        <label>Letras gregas — clique num campo de texto abaixo e depois na letra pra inserir</label>
        <div id="paleta-grega" style="display:flex; flex-wrap:wrap; gap:4px;"></div>
      </div>
      <div class="field">
        <label>Variáveis</label>
        <div id="nq-vars"></div>
        <button class="btn subtle" id="nq-add-var" type="button">+ Adicionar variável</button>
      </div>
      <div class="field">
        <label>Fórmula da resposta correta (use os nomes das variáveis, ex: <code>d/t</code>)</label>
        <input id="nq-formula" class="mono" placeholder="Ex: d/t" />
        <div class="hint">Suporta + − × ÷ e parênteses. Ex.: <code>(C*i*t)/100</code></div>
      </div>
      <div style="display:flex; gap:10px; margin-top:6px;">
        <button class="btn subtle" id="nq-testar" type="button">Testar</button>
        <button class="btn" id="nq-salvar" type="button">Salvar questão</button>
      </div>
      <div id="nq-preview" style="margin-top:12px;"></div>
    </div>
  `;

  let campoAtivo = document.getElementById("nq-formula");
  container.addEventListener("focusin", (e) => {
    if (e.target.matches("input, textarea")) campoAtivo = e.target;
  });
  const LETRAS_GREGAS = ["α","β","γ","δ","ε","ζ","η","θ","ι","κ","λ","μ","ν","ξ","ο","π","ρ","σ","τ","υ","φ","χ","ψ","ω","Δ","Σ","Ω","Φ","Ψ","Θ","Λ","Π"];
  document.getElementById("paleta-grega").innerHTML = LETRAS_GREGAS.map((l) =>
    `<button type="button" class="btn subtle" data-letra-grega="${l}" style="padding:5px 10px; font-size:14px; font-family:var(--f-mono);">${l}</button>`
  ).join("");
  document.querySelectorAll("[data-letra-grega]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const el = campoAtivo;
      if (!el) return;
      const start = el.selectionStart ?? el.value.length;
      const end = el.selectionEnd ?? el.value.length;
      const ch = btn.dataset.letraGrega;
      el.value = el.value.slice(0, start) + ch + el.value.slice(end);
      el.selectionStart = el.selectionEnd = start + ch.length;
      el.dispatchEvent(new Event("input", { bubbles: true }));
      el.focus();
    });
  });

  function renderVarRows() {
    document.getElementById("nq-vars").innerHTML = state.novaQuestaoVars.map((v, i) => `
      <div class="var-row">
        <input placeholder="nome (ex: F)" value="${v.nome}" data-vi="${i}" data-campo="nome" class="mono" />
        <input placeholder="min" type="number" value="${v.min}" data-vi="${i}" data-campo="min" class="mono" />
        <input placeholder="max" type="number" value="${v.max}" data-vi="${i}" data-campo="max" class="mono" />
        <input placeholder="decimais" type="number" value="${v.decimais}" data-vi="${i}" data-campo="decimais" class="mono" />
        <button class="btn danger" style="padding:5px 8px;" data-remove-var="${i}" type="button">×</button>
      </div>
    `).join("");
    document.querySelectorAll("[data-vi]").forEach((el) => {
      el.addEventListener("input", () => {
        const i = Number(el.dataset.vi), campo = el.dataset.campo;
        state.novaQuestaoVars[i][campo] = campo === "nome" ? el.value.trim() : Number(el.value);
      });
    });
    document.querySelectorAll("[data-remove-var]").forEach((el) => {
      el.addEventListener("click", () => {
        state.novaQuestaoVars.splice(Number(el.dataset.removeVar), 1);
        renderVarRows();
      });
    });
  }
  renderVarRows();

  document.getElementById("nq-add-var").addEventListener("click", () => {
    state.novaQuestaoVars.push({ nome: "", min: 0, max: 10, decimais: 0 });
    renderVarRows();
  });

  function coletarQuestao() {
    return {
      tema: document.getElementById("nq-tema").value.trim(),
      dificuldade: Number(document.getElementById("nq-dificuldade").value),
      unidade: document.getElementById("nq-unidade").value.trim(),
      enunciado: document.getElementById("nq-enunciado").value.trim(),
      variaveis: state.novaQuestaoVars.filter((v) => v.nome),
      formula: document.getElementById("nq-formula").value.trim(),
    };
  }

  function testar() {
    const q = coletarQuestao();
    const erroEl = document.getElementById("erro-questao");
    const previewEl = document.getElementById("nq-preview");
    erroEl.innerHTML = "";
    if (!q.tema || !q.enunciado || !q.formula || q.variaveis.length === 0) {
      erroEl.innerHTML = `<div class="error-box">Preencha tema, enunciado, ao menos uma variável e a fórmula.</div>`;
      return null;
    }
    try {
      const rng = new Rng(Date.now() % 100000 + 1);
      const valores = gerarValores(q, rng);
      const resposta = roundTo(avaliarExpressao(q.formula, valores), 2);
      const alternativas = gerarAlternativas(resposta, rng);
      previewEl.innerHTML = `<div class="ok-box">
        <div style="margin-bottom:10px;">${montarEnunciado(q.enunciado, valores)}</div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          ${alternativas.map((a) => `
            <div style="display:flex; align-items:center; gap:8px; ${a.correta ? 'color:var(--green); font-weight:600;' : ''}">
              <span class="mono">${a.letra})</span> <span class="mono">${a.valor} ${q.unidade}</span> ${a.correta ? '← correta' : ''}
            </div>
          `).join("")}
        </div>
      </div>`;
      return q;
    } catch (e) {
      erroEl.innerHTML = `<div class="error-box">Erro na fórmula ou no enunciado: ${e.message}</div>`;
      return null;
    }
  }

  document.getElementById("nq-testar").addEventListener("click", testar);
  document.getElementById("nq-salvar").addEventListener("click", async () => {
    if (!armazenamentoDisponivel()) {
      document.getElementById("erro-questao").innerHTML = `<div class="error-box">Não é possível salvar: este arquivo está aberto localmente, fora do Claude. Use o painel do artefato dentro da conversa, ou o link publicado.</div>`;
      return;
    }
    const q = testar();
    if (!q) return;
    q.id = "q_" + Date.now().toString(36);
    const atuais = (await storageGet("questoes")) || [];
    atuais.push(q);
    const ok = await storageSet("questoes", atuais);
    if (!ok) {
      document.getElementById("erro-questao").innerHTML = `<div class="error-box">Não foi possível salvar a questão (falha no armazenamento). Tente novamente.</div>`;
      return;
    }
    state.novaQuestaoVars = [{ nome: "", min: 0, max: 10, decimais: 0 }, { nome: "", min: 0, max: 10, decimais: 0 }];
    renderBanco(content, false);
  });
}

      </div>

          <textarea id="alunos" placeholder="Ana Souza
Bruno Carvalho
Camila Ferreira"></textarea>
          <div class="hint">Cada aluno recebe um código de acesso único.</div>
        </div>
        <div class="row divider" style="font-size:12px; color:var(--ink-muted);">
          <span>Questões selecionadas</span><span class="mono" style="color:var(--teal);">${state.selecionadas.size}</span>
        </div>
        <button class="btn" id="btn-publicar" style="width:100%; justify-content:center;" ${state.selecionadas.size===0?"disabled":""}>Publicar e gerar provas</button>
        <div id="erro-publicar"></div>
      </div>
    </div>
  `;

  content.querySelectorAll("[data-toggle]").forEach((el) => {
    el.addEventListener("click", () => {
      const id = el.dataset.toggle;
      state.selecionadas.has(id) ? state.selecionadas.delete(id) : state.selecionadas.add(id);
      renderMontar(content);
    });
  });

  document.getElementById("btn-publicar").addEventListener("click", async (e) => {
    const nomesRaw = document.getElementById("alunos").value.split("\n").map((n) => n.trim()).filter(Boolean);
    const erroEl = document.getElementById("erro-publicar");
    if (!armazenamentoDisponivel()) {
      erroEl.innerHTML = `<div class="error-box">Não é possível publicar: este arquivo está aberto localmente, fora do Claude. Use o painel do artefato dentro da conversa, ou o link publicado.</div>`;
      return;
    }
    if (nomesRaw.length === 0) { erroEl.innerHTML = `<div class="error-box">Adicione ao menos um aluno.</div>`; return; }

    e.target.disabled = true; e.target.textContent = "Gerando provas…";
    try {
      const provaId = "pm_" + Date.now().toString(36);
      const alunos = nomesRaw.map((nome) => ({ nome, codigo: gerarCodigo() }));
      const provaMestre = {
        id: provaId,
        titulo: document.getElementById("titulo").value.trim() || "Prova",
        turma: document.getElementById("turma").value.trim() || "Turma",
        duracaoMinutos: Number(document.getElementById("duracao").value) || 50,
        questaoIds: Array.from(state.selecionadas),
        status: "publicada",
        criadoEm: Date.now(),
        alunos,
      };

      const questoesBanco = (await storageGet("questoes")) || [];
      for (const aluno of alunos) {
        const questoesGeradas = gerarProvaAluno(provaMestre, questoesBanco, aluno.nome, aluno.codigo);
        await storageSet(`prova-individual-${aluno.codigo}`, {
          provaMestreId: provaId, alunoNome: aluno.nome, tituloProva: provaMestre.titulo,
          duracaoMinutos: provaMestre.duracaoMinutos, questoes: questoesGeradas, respostas: {},
          status: "gerada", acertos: null, total: questoesGeradas.length,
        });
      }

      const provasAtuais = (await storageGet("provas")) || [];
      provasAtuais.push(provaMestre);
      await storageSet("provas", provasAtuais);

      state.publicarResultado = provaMestre;
      state.selecionadas = new Set();
      render();
    } catch (err) {
      erroEl.innerHTML = `<div class="error-box">Erro ao publicar: ${err.message}</div>`;
      e.target.disabled = false; e.target.textContent = "Publicar e gerar provas";
    }
  });
}

/* ---------------- Resultados ---------------- */
async function renderResultados(content) {
  const provas = (await storageGet("provas")) || [];
  const publicadas = provas.filter((p) => p.status === "publicada");
  if (publicadas.length === 0) {
    content.innerHTML = `<div class="card muted" style="text-align:center; padding:36px; font-size:13px;">${corners()}Nenhuma prova publicada ainda.</div>`;
    return;
  }
  if (!state.provaAtualId || !publicadas.find((p) => p.id === state.provaAtualId)) state.provaAtualId = publicadas[publicadas.length-1].id;
  const provaSel = publicadas.find((p) => p.id === state.provaAtualId);

  content.innerHTML = `
    <div class="row" style="align-items:flex-end; margin-bottom:18px;">
      <div><div class="eyebrow">RESULTADOS</div><h1 class="tight">${provaSel.titulo}</h1></div>
      <div style="display:flex; gap:8px; align-items:center;">
        <select id="select-prova" class="mono" style="background:var(--surface-raised); border:1px solid var(--line); color:var(--ink); padding:6px 10px; font-size:12px;">
          ${publicadas.map((p) => `<option value="${p.id}" ${p.id===state.provaAtualId?"selected":""}>${p.titulo}</option>`).join("")}
        </select>
        <button class="btn subtle" id="btn-atualizar">Atualizar</button>
      </div>
    </div>
    <div id="resultados-corpo"><div class="spinner">Carregando respostas dos alunos…</div></div>
  `;

  document.getElementById("select-prova").addEventListener("change", (e) => { state.provaAtualId = e.target.value; render(); });
  document.getElementById("btn-atualizar").addEventListener("click", () => carregarResultados(provaSel));

  await carregarResultados(provaSel);
}

async function carregarResultados(provaSel) {
  const corpo = document.getElementById("resultados-corpo");
  const linhas = [];
  for (const aluno of provaSel.alunos) {
    const exam = await storageGet(`prova-individual-${aluno.codigo}`);
    if (!exam) continue;
    const acertos = exam.status === "finalizada" ? exam.questoes.filter((q) => exam.respostas[q.questaoId] === q.respostaCorretaLetra).length : null;
    linhas.push({
      nome: aluno.nome, status: exam.status, acertos, total: exam.questoes.length,
      nota: acertos !== null ? +((acertos / exam.questoes.length) * 10).toFixed(2) : null,
      exam,
    });
  }

  const finalizadas = linhas.filter((l) => l.nota !== null);
  const notas = finalizadas.map((l) => l.nota);
  const media = notas.length ? notas.reduce((a,b)=>a+b,0)/notas.length : null;
  const sorted = [...notas].sort((a,b)=>a-b);
  const mediana = sorted.length ? sorted[Math.floor(sorted.length/2)] : null;
  const desvio = notas.length && media!==null ? Math.sqrt(notas.reduce((acc,n)=>acc+(n-media)**2,0)/notas.length) : null;

  const erroPorTema = {};
  for (const l of finalizadas) {
    for (const q of l.exam.questoes) {
      const resp = l.exam.respostas[q.questaoId];
      if (!resp) continue;
      if (!erroPorTema[q.tema]) erroPorTema[q.tema] = { erros: 0, total: 0 };
      erroPorTema[q.tema].total++;
      if (resp !== q.respostaCorretaLetra) erroPorTema[q.tema].erros++;
    }
  }
  const ranking = Object.entries(erroPorTema).map(([tema, v]) => ({ tema, pct: Math.round((v.erros/v.total)*100) })).sort((a,b)=>b.pct-a.pct);

  corpo.innerHTML = `
    <div class="grid-stats" style="margin-bottom:14px;">
      <div class="card">${corners()}<div class="stat-label">Média</div><div class="stat-value">${media!==null?media.toFixed(1):"—"}</div></div>
      <div class="card">${corners()}<div class="stat-label">Mediana</div><div class="stat-value">${mediana!==null?mediana.toFixed(1):"—"}</div></div>
      <div class="card">${corners()}<div class="stat-label">Desvio padrão</div><div class="stat-value">${desvio!==null?desvio.toFixed(2):"—"}</div></div>
    </div>
    ${ranking.length>0 ? `
    <div class="card" style="margin-bottom:14px;">${corners()}
      <div class="mono muted" style="font-size:11px; letter-spacing:.06em; text-transform:uppercase; margin-bottom:10px;">⚠ Temas com mais erro</div>
      ${ranking.slice(0,4).map((r)=>`
        <div style="margin-bottom:10px;">
          <div class="row" style="font-size:12px; margin-bottom:4px;"><span class="muted">${r.tema}</span><span class="mono" style="color:var(--amber);">${r.pct}%</span></div>
          <div style="height:4px; background:var(--line-faint);"><div style="height:4px; width:${r.pct}%; background:var(--amber);"></div></div>
        </div>
      `).join("")}
    </div>` : ""}
    <div class="card">${corners()}
      <div class="mono muted" style="font-size:11px; letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px;">Notas por aluno (${finalizadas.length}/${linhas.length} finalizaram)</div>
      ${linhas.map((l,i) => `
        <div class="row" style="padding:9px 0; ${i>0?'border-top:1px solid var(--line-faint);':''}">
          <span style="font-size:13px;">${l.nome}</span>
          <span class="mono muted" style="font-size:11.5px;">${l.status==='finalizada'?`${l.acertos}/${l.total} acertos`:l.status}</span>
          <span style="font-family:var(--f-display); font-weight:700; font-size:14px; width:36px; text-align:right; color:${l.nota===null?'var(--ink-faint)':(l.nota>=6?'var(--green)':'var(--red)')};">${l.nota!==null?l.nota.toFixed(1):"—"}</span>
        </div>
      `).join("")}
    </div>
  `;
}

/* ============================================================
   ÁREA DO ALUNO
   ============================================================ */
function shellAluno(inner) {
  return `
    <div class="wrap-narrow" style="padding-top:20px;">
      ${bannerSemArmazenamento()}
      <div class="header" style="border:none; margin-bottom:10px; padding:0 0 14px;">
        <div class="brand"><div class="brand-mark"><span>PM</span></div><div><div class="brand-title">Prova-Mestre</div><div class="brand-sub">ÁREA DO ALUNO</div></div></div>
        <div class="mode-toggle"><div id="voltar-inicio-aluno">← Trocar de papel</div></div>
      </div>
      ${inner}
    </div>
  `;
}

async function renderAluno() {
  if (!state.aluno.exam) return renderAlunoCodigo();
  if (state.aluno.resultado) return renderAlunoResultado();
  if (state.aluno.exam.status === "gerada" && state.aluno.atual === 0 && !state.aluno.iniciou) return renderAlunoInstrucoes();
  return renderAlunoProva();
}

function renderAlunoCodigo() {
  app.innerHTML = shellAluno(`
    <div style="text-align:center; padding-top:20px;">
      <h1>Digite seu código de acesso</h1>
      <p class="muted" style="font-size:13px; margin-bottom:20px;">O código foi passado pelo seu professor(a).</p>
      <input id="codigo-input" class="mono" style="text-align:center; font-size:20px; letter-spacing:.15em; padding:14px; background:var(--surface-raised); border:1px solid var(--line); color:var(--teal); width:100%; margin-bottom:14px; text-transform:uppercase;" placeholder="EX: A1B2C3" maxlength="8" />
      <div id="erro-codigo"></div>
      <button class="btn" id="btn-entrar" style="width:100%; justify-content:center;">Acessar prova</button>
    </div>
  `);
  document.getElementById("voltar-inicio-aluno").addEventListener("click", () => { state.papel = null; render(); });
  const input = document.getElementById("codigo-input");
  input.focus();
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") entrar(); });
  document.getElementById("btn-entrar").addEventListener("click", entrar);

  async function entrar() {
    const codigo = input.value.trim().toUpperCase();
    const erroEl = document.getElementById("erro-codigo");
    if (!codigo) return;
    const exam = await storageGet(`prova-individual-${codigo}`);
    if (!exam) { erroEl.innerHTML = `<div class="error-box">Código não encontrado. Confira com seu professor(a).</div>`; return; }
    state.aluno.codigo = codigo;
    state.aluno.exam = exam;
    state.aluno.respostas = { ...exam.respostas };
    state.aluno.segundos = exam.duracaoMinutos * 60;
    state.aluno.atual = 0;
    if (exam.status === "finalizada") { state.aluno.resultado = calcularResultadoAluno(exam); }
    render();
  }
}

function renderAlunoInstrucoes() {
  const e = state.aluno.exam;
  app.innerHTML = shellAluno(`
    <div style="text-align:center; display:flex; flex-direction:column; gap:16px; align-items:center;">
      <div class="seal">✓ PROVA-MESTRE · EQUIVALÊNCIA VERIFICADA</div>
      <h1>${e.tituloProva}</h1>
      <p class="muted" style="font-size:13.5px; line-height:1.6;">
        Você é <b style="color:var(--ink);">${e.alunoNome}</b>. Esta prova tem <b style="color:var(--ink);">${e.questoes.length} questões</b>,
        equivalentes às dos colegas — mesmos temas e dificuldade, com valores individuais.
      </p>
      <div class="card" style="width:100%; text-align:left;">${corners()}
        <div class="row" style="font-size:13px; padding:6px 0;"><span class="muted">Duração</span><span>${e.duracaoMinutos} minutos</span></div>
        <div class="row" style="font-size:13px; padding:6px 0; border-top:1px solid var(--line-faint);"><span class="muted">Questões</span><span>${e.questoes.length}</span></div>
      </div>
      <button class="btn" id="btn-iniciar">Iniciar prova →</button>
    </div>
  `);
  document.getElementById("voltar-inicio-aluno").addEventListener("click", () => { state.papel = null; render(); });
  document.getElementById("btn-iniciar").addEventListener("click", () => {
    state.aluno.iniciou = true;
    render();
    state.aluno.timer = setInterval(tickTimerAluno, 1000);
  });
}

function tickTimerAluno() {
  state.aluno.segundos = Math.max(0, state.aluno.segundos - 1);
  const el = document.getElementById("timer-aluno");
  if (el) {
    const mm = String(Math.floor(state.aluno.segundos/60)).padStart(2,"0");
    const ss = String(state.aluno.segundos%60).padStart(2,"0");
    el.textContent = `⏱ ${mm}:${ss}`;
    el.style.color = state.aluno.segundos < 300 ? "var(--red)" : "var(--teal)";
  }
  if (state.aluno.segundos === 0) finalizarAluno();
}

function renderAlunoProva() {
  const e = state.aluno.exam;
  const q = e.questoes[state.aluno.atual];
  const mm = String(Math.floor(state.aluno.segundos/60)).padStart(2,"0");
  const ss = String(state.aluno.segundos%60).padStart(2,"0");

  app.innerHTML = shellAluno(`
    <div class="row" style="margin-bottom:8px;">
      <span class="mono muted" style="font-size:11.5px;">QUESTÃO ${state.aluno.atual+1} / ${e.questoes.length}</span>
      <span class="mono" id="timer-aluno" style="font-size:13px; color:${state.aluno.segundos<300?'var(--red)':'var(--teal)'};">⏱ ${mm}:${ss}</span>
    </div>
    <div class="progress-track">
      ${e.questoes.map((qq,i)=>`<div class="progress-seg ${state.aluno.respostas[qq.questaoId]?'answered':(i===state.aluno.atual?'current':'')}" data-jump="${i}"></div>`).join("")}
    </div>
    <div class="card">${corners()}
      <span class="pill">${q.tema}</span>
      <div style="font-size:15px; line-height:1.7; margin-top:14px;">${q.enunciado}</div>
      <div style="margin-top:16px;">
        ${q.alternativas.map((a)=>`
          <div class="option ${state.aluno.respostas[q.questaoId]===a.letra?'selected':''}" data-letra="${a.letra}">
            <div class="option-letter">${a.letra}</div><span class="mono" style="font-size:13.5px;">${a.valor} ${q.unidade}</span>
          </div>
        `).join("")}
      </div>
    </div>
    <div class="row" style="margin-top:14px;">
      <button class="btn ghost" id="btn-ant" ${state.aluno.atual===0?"disabled":""}>← Anterior</button>
      ${state.aluno.atual < e.questoes.length-1 ? `<button class="btn" id="btn-prox">Próxima →</button>` : `<button class="btn" id="btn-fim">✓ Finalizar prova</button>`}
    </div>
  `);
  document.getElementById("voltar-inicio-aluno").addEventListener("click", () => { if(confirm("Sair sem finalizar a prova?")) { state.papel = null; render(); } });

  document.querySelectorAll("[data-letra]").forEach((el) => {
    el.addEventListener("click", async () => {
      state.aluno.respostas[q.questaoId] = el.dataset.letra;
      state.aluno.exam.respostas = state.aluno.respostas;
      await storageSet(`prova-individual-${state.aluno.codigo}`, state.aluno.exam);
      renderAlunoProva();
    });
  });
  document.querySelectorAll("[data-jump]").forEach((el) => el.addEventListener("click", () => { state.aluno.atual = Number(el.dataset.jump); render(); }));
  document.getElementById("btn-ant")?.addEventListener("click", () => { state.aluno.atual--; render(); });
  document.getElementById("btn-prox")?.addEventListener("click", () => { state.aluno.atual++; render(); });
  document.getElementById("btn-fim")?.addEventListener("click", finalizarAluno);
}

function calcularResultadoAluno(exam) {
  const acertos = exam.questoes.filter((q) => exam.respostas[q.questaoId] === q.respostaCorretaLetra).length;
  return { acertos, total: exam.questoes.length, percentual: Math.round((acertos/exam.questoes.length)*100),
    detalhe: exam.questoes.map((q) => ({ tema: q.tema, correta: exam.respostas[q.questaoId] === q.respostaCorretaLetra })) };
}

async function finalizarAluno() {
  if (state.aluno.timer) clearInterval(state.aluno.timer);
  state.aluno.exam.status = "finalizada";
  state.aluno.exam.respostas = state.aluno.respostas;
  await storageSet(`prova-individual-${state.aluno.codigo}`, state.aluno.exam);
  state.aluno.resultado = calcularResultadoAluno(state.aluno.exam);
  render();
}

function renderAlunoResultado() {
  const r = state.aluno.resultado;
  const cor = r.percentual >= 60 ? "var(--green)" : "var(--red)";
  app.innerHTML = shellAluno(`
    <div style="text-align:center; display:flex; flex-direction:column; gap:14px; align-items:center; padding-top:10px;">
      <div style="width:92px; height:92px; border-radius:50%; border:2px solid ${cor}; display:flex; align-items:center; justify-content:center;">
        <span style="font-family:var(--f-display); font-size:24px; font-weight:700; color:${cor};">${r.percentual}%</span>
      </div>
      <h1 style="font-size:20px;">Prova corrigida automaticamente</h1>
      <p class="muted" style="font-size:13.5px;">Você acertou <b style="color:var(--ink);">${r.acertos} de ${r.total}</b> questões.</p>
      <div style="display:flex; flex-direction:column; gap:8px; width:100%;">
        ${r.detalhe.map((d)=>`
          <div style="display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--surface); border:1px solid var(--line-faint);">
            <span style="color:${d.correta?'var(--green)':'var(--red)'};">${d.correta?"✓":"✗"}</span>
            <span class="muted" style="font-size:12px; text-align:left; flex:1;">${d.tema}</span>
          </div>
        `).join("")}
      </div>
    </div>
  `);
  document.getElementById("voltar-inicio-aluno").addEventListener("click", () => { state.papel = null; render(); });
}

/* ============================================================
   ROTEADOR PRINCIPAL
   ============================================================ */
async function render() {
  if (!state.papel) return renderInicial();
  if (state.papel === "professor") return renderProfessor();
  if (state.papel === "aluno") return renderAluno();
}

(async function start() {
  app.innerHTML = `<div class="spinner">Carregando…</div>`;
  await garantirBancoInicial();
  render();
})();
</script>
</body>
</html>
