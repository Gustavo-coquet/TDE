<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TDE - La Salle — Painel do Professor</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <!-- KaTeX: renderiza equações entre $...$ (inline) e $$...$$ (display) como no Word -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="brand">
        <div class="brand-mark"><span>TDE</span></div>
        <div>
          <div class="brand-title">TDE - La Salle</div>
          <div class="brand-sub">TRABALHO DISCENTE EFETIVO</div>
        </div>
      </div>
      <div class="muted mono" style="font-size:11.5px;">MVP local · backend + PostgreSQL</div>
    </div>

    <div class="layout">
      <div class="nav" id="nav">
        <div class="nav-item active" data-view="turmas">Turmas</div>
        <div class="nav-item" data-view="banco">Banco de Questões</div>
        <div class="nav-item" data-view="resultados">Resultados</div>
      </div>
      <div id="content" style="padding-bottom:60px;"></div>
    </div>

    <div class="mono muted" style="text-align:center; font-size:10.5px; padding:20px 0; opacity:.6;">
      Desenvolvido por Dsc. Gustavo Coquet Braga
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
